# Proyecto de SonarQube local para signall-backend.
#
#   ../signall-android/tools/calidad/sonar.sh signall-backend
#
# Python no necesita binarios: el scanner lo analiza directo.

sonar.projectKey=signall-backend
sonar.projectName=signall-backend
sonar.sourceEncoding=UTF-8

sonar.sources=app
# El repo no tiene carpeta `tests/`: si se agrega, descomentar.
#sonar.tests=tests

sonar.exclusions=\
  **/__pycache__/**, \
  **/build/**, \
  **/deploy/**

# Cobertura real: la genera `scripts/cobertura.sh`, que corre los
# `scripts/verify_*.py` (las pruebas de facto del proyecto) bajo `coverage` y
# escribe `coverage.xml` en la raíz. Sin ese archivo Sonar informa 0 %, así que
# hay que correr el script antes de escanear.
sonar.python.coverage.reportPaths=coverage.xml
