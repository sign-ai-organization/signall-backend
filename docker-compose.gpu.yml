# GPU opt-in. Not part of the base stack: CPU is the base case.
#
# Add this file after the base and host overrides:
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml \
#                  -f docker-compose.gpu.yml up -d
#
# It does two things:
#   1. Fixes the STT to CUDA (cuda / float16 / medium) and reserves one NVIDIA
#      device, which needs the NVIDIA Container Toolkit (or Docker Desktop with
#      GPU support). The values are fixed instead of read from the environment
#      on purpose: asking for the GPU is explicit and manual, and nothing here
#      detects the hardware.
#   2. Builds the backend image with a CUDA-capable torch. The base Dockerfile
#      installs the CPU wheel; PyPI's Linux wheel carries the CUDA runtime.
#      A pinned CUDA index also works, as long as TORCH_VERSION has a build
#      there, for example:
#
#        TORCH_INDEX_URL=https://download.pytorch.org/whl/cu130 \
#        TORCH_VERSION=2.14.1 docker compose ... -f docker-compose.gpu.yml up -d --build
#
# Without a GPU, do not use this file: the base + host stack is the CPU one.
services:
  backend:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://pypi.org/simple}
        TORCH_VERSION: ${TORCH_VERSION:-2.15.0}

  stt:
    environment:
      MODEL_SIZE: medium
      DEVICE: cuda
      COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
