services:
  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env

  # STT service (Whisper), lives in a separate repo (sign-ai-stt.
  stt:
    build: ../sign-ai-stt
    ports:
      - "8000:8000"
    environment:
      MODEL_SIZE: medium
      DEVICE: cuda
      COMPUTE_TYPE: float16
      LANGUAGE: es
      SILENCE_TIMEOUT_MS: 1500
    volumes:
      - stt-hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  stt-hf-cache:
