services:
  backend:
    build: .
    # Host networking, not the bridge, for two reasons:
    #
    #  1. The STT service is reached on 127.0.0.1:8000 (its published port)
    #     instead of by the "stt" service name, which only resolves on a
    #     user-defined bridge.
    #  2. A local LLM server (Ollama on 11434, LM Studio on 1234) is reachable
    #     straight away. Docker installs a DROP policy for traffic from the
    #     bridge to the host, so a container on a bridge cannot open a socket to
    #     a model server bound on the host's loopback or even on the bridge
    #     gateway — verified: same container, HTTP 200 with --network host and a
    #     timeout with the default bridge. That is why the docs elsewhere say
    #     "listen on 0.0.0.0"; on this machine it is not sufficient.
    #
    # The Dockerfile binds 0.0.0.0:8080, which with the previous `ports:
    # "8080:8080"` published the same thing, so this does not expose anything
    # that was not already reachable.
    network_mode: host
    env_file:
      - .env

  # STT service (Whisper), lives in a separate repo (sign-ai-stt.
  stt:
    build: ../sign-ai-stt
    ports:
      - "8000:8000"
    environment:
      MODEL_SIZE: medium
      DEVICE: cuda
      COMPUTE_TYPE: float16
      LANGUAGE: es
      SILENCE_TIMEOUT_MS: 1500
    volumes:
      - stt-hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  stt-hf-cache:
