services:
  backend:
    build: .
    # Compose network plus a published port: this is what RNF-POR-02 asks for,
    # because the service behaves the same on Linux, on macOS and on Windows with
    # Docker Desktop, and does not depend on the engine supporting host networks.
    #
    # Inside this network `localhost` is the container itself, so the STT is
    # addressed by its service name: `ws://stt:8000/ws/transcribe`, which is the
    # default in `app/config/settings.py` and in `.env.example`. The address does
    # not need to be overridden in `.env` anymore.
    #
    # A model server running on the *host* (Ollama on 11434, LM Studio on 1234) is
    # reached through `host.docker.internal`, declared below as an alias of the
    # bridge gateway. It works out of the box on Docker Desktop. On Linux the
    # bridge-to-host path is filtered by the host firewall: with `ufw` active
    # (verified on the thesis machine, 2026-10-26) `172.17.0.1:11434` and
    # `host.docker.internal:11434` both time out from a bridge container even
    # though the same container reaches the internet. When that happens there are
    # two ways out: open the firewall for the docker0 subnet, or run the backend
    # on the host network with `docker-compose.host.yml`, which is the same file
    # this backend used before and is documented there.
    #
    # The Dockerfile binds 0.0.0.0:8080, and `8080:8080` publishes exactly what
    # `network_mode: host` exposed before, so the Android client (10.0.2.2 in the
    # emulator) is unaffected.
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

  # STT service (Whisper), lives in a separate repo (sign-ai-stt).
  # Its port stays published because the tooling on the host reaches it at
  # 127.0.0.1:8000 (`tools/verificar-conexiones-stt.py`, `scripts/fixtures/`).
  stt:
    build: ../sign-ai-stt
    ports:
      - "8000:8000"
    environment:
      MODEL_SIZE: medium
      DEVICE: cuda
      COMPUTE_TYPE: float16
      LANGUAGE: es
      SILENCE_TIMEOUT_MS: 1500
    volumes:
      - stt-hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  stt-hf-cache:
