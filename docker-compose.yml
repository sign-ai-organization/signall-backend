services:
  backend:
    build: .
    # Host networking, not the bridge, for two reasons:
    #
    #  1. The STT service is reached on 127.0.0.1:8000 (its published port)
    #     instead of by the "stt" service name, which only resolves on a
    #     user-defined bridge.
    #  2. A local LLM server (Ollama on 11434, LM Studio on 1234) is reachable
    #     straight away. Docker installs a DROP policy for traffic from the
    #     bridge to the host, so a container on a bridge cannot open a socket to
    #     a model server bound on the host's loopback or even on the bridge
    #     gateway — verified: same container, HTTP 200 with --network host and a
    #     timeout with the default bridge. That is why the docs elsewhere say
    #     "listen on 0.0.0.0"; on this machine it is not sufficient.
    #
    # The Dockerfile binds 0.0.0.0:8080, which with the previous `ports:
    # "8080:8080"` published the same thing, so this does not expose anything
    # that was not already reachable.
    network_mode: host
    env_file:
      - .env

  # STT service (Whisper), lives in a separate repo (sign-ai-stt).
  #
  # Los valores de latencia vienen de variables de entorno con default en el
  # perfil de tiempo real de `sign-ai-stt/app/config.py`. Acá se listan
  # explicitamente para que un despliegue los vea de un vistazo; si se saca uno,
  # el default del perfil sigue aplicando.
  stt:
    build: ../sign-ai-stt
    ports:
      - "8000:8000"
    environment:
      MODEL_SIZE: ${STT_MODEL_SIZE:-medium}
      # Modelo chico para los parciales. Se descarta en cuanto llega el final,
      # asi que no necesita la precision del modelo de finales.
      PARTIAL_MODEL_SIZE: ${STT_PARTIAL_MODEL_SIZE:-small}
      PARTIAL_COMPUTE_TYPE: ${STT_PARTIAL_COMPUTE_TYPE:-float16}
      DEVICE: cuda
      COMPUTE_TYPE: float16
      LANGUAGE: es
      # Hangover de silencio: el mayor termino de la latencia percibida.
      SILENCE_TIMEOUT_MS: ${STT_SILENCE_TIMEOUT_MS:-600}
      PARTIAL_INTERVAL_MS: ${STT_PARTIAL_INTERVAL_MS:-250}
      SPEECH_ONSET_WINDOW_MS: ${STT_SPEECH_ONSET_WINDOW_MS:-150}
      AVG_LOGPROB_THRESHOLD: ${STT_AVG_LOGPROB_THRESHOLD:--1.0}
      WORD_TIMESTAMPS: ${STT_WORD_TIMESTAMPS:-true}
    volumes:
      - stt-hf-cache:/root/.cache/huggingface
      # Fixtures de audio de `sign-ai-stt/scripts/make_audio_fixtures.py`, de
      # solo lectura: las pruebas de latencia extremo a extremo los reproducen
      # por el socket sin necesitar el microfono.
      - ../sign-ai-stt/fixtures:/fixtures:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  stt-hf-cache:
